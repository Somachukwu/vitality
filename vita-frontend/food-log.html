<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Food log</title>
  <link rel="icon" type="image/png" href="vitality-favicon.png" sizes="128x128" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0B0F19" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="apple-touch-icon" href="vitality-logo-icon.png" />
  <link rel="stylesheet" href="styles/main.css" />
  <script>if(localStorage.getItem('theme')==='dark')document.documentElement.classList.add('dark')</script>
</head>
<body>
  <div class="app has-side">
    <aside class="side-nav"></aside>
    <div>
      <header class="app-header">
        <div class="container">
          <h2>Food log</h2>
          <button class="btn btn-ghost" id="theme-btn" aria-label="Toggle theme"><i data-lucide="moon"></i></button>
        </div>
      </header>
      <main class="container stack">
        <section class="card">
          <div class="card-title">Log a new meal</div>
          <div class="dropzone" id="dropzone">
            <i data-lucide="camera"></i>
            <div><strong>Take a photo or choose from gallery</strong></div>
            <div class="text-xs muted mt-1">Camera photo, JPEG, PNG or WebP</div>
            <input id="camera-file" type="file" accept="image/*" capture="environment" hidden />
            <input id="gallery-file" type="file" accept="image/*" hidden />
          </div>

  <div id="option-modal" class="overlay hidden">
    <div class="overlay-card" style="width: 90%; max-width: 360px; padding: 1.5rem;">
      <div style="font-weight: 600; font-size: 1.1rem; margin-bottom: 0.5rem;">Choose photo source</div>
      <p class="muted text-xs mb-2">Snap a photo of your meal or upload an image from your gallery.</p>
      <div class="stack gap-sm mt-2">
        <button class="btn btn-primary btn-block row center gap-sm" id="modal-camera-btn" type="button">
          <i data-lucide="camera"></i> Take Photo with Camera
        </button>
        <button class="btn btn-ghost btn-block row center gap-sm" id="modal-gallery-btn" type="button">
          <i data-lucide="image"></i> Upload from Gallery
        </button>
        <button class="btn btn-ghost btn-block mt-1 text-xs muted" id="modal-cancel-btn" type="button">
          Cancel
        </button>
      </div>
    </div>
  </div>
          <div id="preview-wrap" class="mt-2 hidden">
            <img id="preview" alt="Selected meal" style="width:100%; max-height:280px; object-fit:cover; border-radius:12px"/>
            <div class="mt-2">
              <label for="portion-size">Portion size <span class="muted text-xs">(number of servings)</span></label>
              <input id="portion-size" type="number" min="0.25" max="10" step="0.25" value="1" placeholder="e.g. 1" style="width:auto; min-width:120px" />
            </div>
            <div class="row gap-sm mt-2">
              <button class="btn btn-primary" id="analyze-btn"><i data-lucide="sparkles"></i> Analyze meal</button>
              <button class="btn btn-ghost" id="clear-btn">Clear</button>
            </div>
          </div>
        </section>

        <section id="result" class="hidden"></section>

        <section>
          <div class="row between mb-1 flex-wrap">
            <h2>Meal history</h2>
            <div class="filter-row">
              <label class="text-xs muted" for="date-filter">Filter by date</label>
              <input type="date" id="date-filter" style="width:auto" />
            </div>
          </div>
          <div class="list" id="history"></div>
        </section>
      </main>
    </div>
  </div>

  <div id="overlay" class="overlay hidden">
    <div class="overlay-card">
      <div class="spinner"></div>
      <strong>Identifying your meal…</strong>
      <p class="muted text-sm mt-1">Our vision model is recognizing items and estimating portions.</p>
    </div>
  </div>

  <script async src="https://unpkg.com/lucide@latest" onload="window.lucide&&window.lucide.createIcons()"></script>
  <script type="module" src="js/food-log.js"></script>
</body>
</html>
