<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Vitals history</title>
  <link rel="icon" type="image/png" href="vitality-favicon.png" sizes="128x128" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0B0F19" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="apple-touch-icon" href="vitality-logo-icon.png" />
  <link rel="stylesheet" href="styles/main.css" />
  <script>if(localStorage.getItem('theme')==='dark')document.documentElement.classList.add('dark')</script>
</head>
<body>
  <div class="app has-side">
    <aside class="side-nav"></aside>
    <div>
      <header class="app-header header-with-controls">
        <div class="container">
          <h2>Vitals history</h2>
          <div class="header-controls">
            <select id="range">
              <option value="1">Last 24 hours</option>
              <option value="7" selected>Last 7 days</option>
              <option value="30">Last 30 days</option>
            </select>
            <button class="btn btn-ghost" id="theme-btn" aria-label="Toggle theme"><i data-lucide="moon"></i></button>
          </div>

        </div>
      </header>
      <main class="container stack">
        <div class="text-xs muted" id="last-sync">—</div>
        <div class="card chart-card" id="card-hr"><div class="chart-card-header"><span class="card-title">Heart rate (bpm)</span><button class="btn-chart-fullscreen" onclick="expandChart('card-hr','c-hr')" title="Full screen"><i data-lucide="maximize-2"></i></button></div><div class="chart-canvas"><canvas id="c-hr"></canvas></div></div>
        <div class="card chart-card" id="card-spo2"><div class="chart-card-header"><span class="card-title">SpO₂ (%)</span><button class="btn-chart-fullscreen" onclick="expandChart('card-spo2','c-spo2')" title="Full screen"><i data-lucide="maximize-2"></i></button></div><div class="chart-canvas"><canvas id="c-spo2"></canvas></div></div>
        <div class="card chart-card" id="card-sleep"><div class="chart-card-header"><span class="card-title">Sleep history &amp; stages (hours)</span><button class="btn-chart-fullscreen" onclick="expandChart('card-sleep','c-sleep')" title="Full screen"><i data-lucide="maximize-2"></i></button></div><div class="chart-canvas"><canvas id="c-sleep"></canvas></div></div>
        <div class="card chart-card" id="card-active"><div class="chart-card-header"><span class="card-title">Active zone minutes (min)</span><button class="btn-chart-fullscreen" onclick="expandChart('card-active','c-active')" title="Full screen"><i data-lucide="maximize-2"></i></button></div><div class="chart-canvas"><canvas id="c-active"></canvas></div></div>
        <div class="card chart-card" id="card-steps"><div class="chart-card-header"><span class="card-title">Steps</span><button class="btn-chart-fullscreen" onclick="expandChart('card-steps','c-steps')" title="Full screen"><i data-lucide="maximize-2"></i></button></div><div class="chart-canvas"><canvas id="c-steps"></canvas></div></div>
        <div class="card chart-card" id="card-dist"><div class="chart-card-header"><span class="card-title">Distance (km)</span><button class="btn-chart-fullscreen" onclick="expandChart('card-dist','c-dist')" title="Full screen"><i data-lucide="maximize-2"></i></button></div><div class="chart-canvas"><canvas id="c-dist"></canvas></div></div>
        <div class="card chart-card" id="card-cal"><div class="chart-card-header"><span class="card-title">Calories burned (kcal)</span><button class="btn-chart-fullscreen" onclick="expandChart('card-cal','c-cal')" title="Full screen"><i data-lucide="maximize-2"></i></button></div><div class="chart-canvas"><canvas id="c-cal"></canvas></div></div>
        <div class="card chart-card" id="card-floors"><div class="chart-card-header"><span class="card-title">Floors climbed</span><button class="btn-chart-fullscreen" onclick="expandChart('card-floors','c-floors')" title="Full screen"><i data-lucide="maximize-2"></i></button></div><div class="chart-canvas"><canvas id="c-floors"></canvas></div></div>
        <div class="card chart-card" id="card-temp"><div class="chart-card-header"><span class="card-title">Body temperature (°C)</span><button class="btn-chart-fullscreen" onclick="expandChart('card-temp','c-temp')" title="Full screen"><i data-lucide="maximize-2"></i></button></div><div class="chart-canvas"><canvas id="c-temp"></canvas></div></div>
        <div class="card chart-card" id="card-wt"><div class="chart-card-header"><span class="card-title">Weight (kg)</span><button class="btn-chart-fullscreen" onclick="expandChart('card-wt','c-wt')" title="Full screen"><i data-lucide="maximize-2"></i></button></div><div class="chart-canvas"><canvas id="c-wt"></canvas></div></div>
        <div class="card">
          <div class="card-title">Anomalies</div>
          <div class="list" id="anomalies"></div>
        </div>
      </main>
    </div>
  </div>
  <script async src="https://unpkg.com/lucide@latest" onload="window.lucide&&window.lucide.createIcons()"></script>
  <script async src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script type="module" src="js/vitals.js"></script>
</body>
</html>
