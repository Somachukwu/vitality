<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Profile</title>
  <link rel="icon" type="image/png" href="vitality-favicon.png" sizes="128x128" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0B0F19" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="apple-touch-icon" href="vitality-logo-icon.png" />
  <link rel="stylesheet" href="styles/main.css" />
  <script>if(localStorage.getItem('theme')==='dark')document.documentElement.classList.add('dark')</script>
</head>
<body>
  <div class="app has-side">
    <aside class="side-nav"></aside>
    <div>
      <header class="app-header">
        <div class="container">
          <h2>Profile & settings</h2>
          <button class="btn btn-ghost" id="theme-btn" aria-label="Toggle theme"><i data-lucide="moon"></i></button>
        </div>
      </header>
      <main class="container stack">

        <!-- Personal Details Card -->
        <section class="card">
          <div class="row between mb-2">
            <div class="card-title" style="margin-bottom:0">Personal details</div>
            <button class="btn btn-ghost" type="button" id="edit-btn">
              <i data-lucide="pencil"></i> <span class="hide-mobile">Edit details</span>
            </button>
          </div>
          <form id="profile-form" class="stack profile-readonly">
            <div class="grid grid-2">
              <div><label>Name</label><input id="name" disabled /></div>
              <div><label>Email</label><input id="email" type="email" disabled /></div>
              <div><label>Age</label><input id="age" type="number" min="13" max="100" disabled /></div>
              <div><label>Sex</label>
                <select id="sex" disabled><option value="">—</option><option value="male">male</option><option value="female">female</option></select>
              </div>
              <div><label>Height (cm)</label><input id="heightCm" type="number" min="100" max="240" disabled /></div>
              <div><label>Weight (kg)</label><input id="weightKg" type="number" step="0.1" disabled /></div>
            </div>
            <div><label>Dietary restrictions</label><input id="diet" placeholder="comma-separated" disabled /></div>
            <div><label>Existing health conditions</label><input id="health" placeholder="e.g. diabetes, hypertension (comma-separated)" disabled /></div>
            <div class="row gap-sm hidden" id="form-actions">
              <button class="btn btn-primary" type="submit">Save changes</button>
              <button class="btn btn-ghost" type="button" id="cancel-btn">Cancel</button>
            </div>
          </form>
        </section>

        <!-- Goals & Targets Card -->
        <section class="card">
          <div class="row between mb-2">
            <div class="card-title" style="margin-bottom:0">Goals &amp; targets</div>
            <button class="btn btn-ghost" type="button" id="edit-goals-btn">
              <i data-lucide="pencil"></i> <span class="hide-mobile">Edit targets</span>
            </button>
          </div>
          <div class="stack profile-readonly">
            <div class="grid grid-2">
              <div>
                <label>Primary fitness goal</label>
                <input id="profile-goal-val" disabled />
              </div>
              <div>
                <label>Daily activity level</label>
                <input id="profile-activity-val" disabled />
              </div>
              <div>
                <label>Daily calorie target</label>
                <input id="profile-cal-val" disabled />
              </div>
              <div>
                <label>Target weight</label>
                <input id="profile-target-weight-val" disabled />
              </div>
            </div>
            <div class="grid grid-3">
              <div>
                <label>Protein target</label>
                <input id="profile-protein-val" disabled />
              </div>
              <div>
                <label>Daily steps target</label>
                <input id="profile-steps-val" disabled />
              </div>
              <div>
                <label>Daily sleep target</label>
                <input id="profile-sleep-val" disabled />
              </div>
            </div>
          </div>
        </section>

        <!-- Notifications Card -->
        <section class="card">
          <div class="card-title">Notifications</div>
          <div class="stack" style="gap:0.75rem">
            <label class="row gap-sm align-center" style="cursor:pointer">
              <input id="notif-push" type="checkbox" />
              <span>Push alerts for health anomalies &amp; critical metrics</span>
            </label>
            <label class="row gap-sm align-center" style="cursor:pointer">
              <input id="notif-email" type="checkbox" />
              <span>Weekly wellness &amp; nutrition email summary</span>
            </label>
          </div>
        </section>

        <!-- Devices Card -->
        <section class="card">
          <div class="row between mb-2">
            <div class="card-title" style="margin-bottom:0">Devices</div>
            <button class="btn btn-ghost" type="button" id="add-device-btn">
              <i data-lucide="plus"></i> <span class="hide-mobile">Add new</span>
            </button>
          </div>
          <form id="device-form" class="stack hidden mb-2">
            <div class="grid grid-2">
              <div>
                <label for="device-name">Device name</label>
                <input id="device-name" placeholder="My Smart Scale" required />
              </div>
              <div>
                <label for="device-uid">Device UID / MAC</label>
                <input id="device-uid" placeholder="AA:BB:CC:DD:EE:FF" required />
              </div>
            </div>
            <div>
              <label for="device-type">Device type</label>
              <select id="device-type">
                <option value="station" selected>Station / Smart Scale (Weight &amp; Environment)</option>
              </select>
            </div>
            <div class="row gap-sm flex-wrap">
              <button class="btn btn-primary" type="submit" id="save-device-btn">Register device</button>
              <button class="btn btn-ghost" type="button" id="cancel-device-btn">Cancel</button>
            </div>
          </form>
          <div id="device-key" class="card card-tinted hidden mb-2"></div>
          <div class="list" id="devices-list">
            <div class="list-item muted">Loading devices...</div>
          </div>
        </section>

        <!-- Connected Services Card -->
        <section class="card">
          <div class="card-title">Connected services</div>
          <div class="list">
            <div class="list-item" id="google-health-row">
              <i data-lucide="activity"></i>
              <div style="flex:1; min-width:0">
                <strong>Google Health</strong>
                <div class="text-xs muted" id="google-health-sub">Loading…</div>
              </div>
              <div class="row gap-xs align-center flex-wrap" style="justify-content:flex-end" id="google-health-actions">
                <!-- Populated by profile.js -->
              </div>
            </div>
          </div>
        </section>



        <!-- Account Card -->
        <section class="card">
          <div class="card-title">Account</div>
          <div class="account-actions">
            <button class="btn btn-ghost" id="change-pw"><i data-lucide="key"></i> Change password</button>
            <button class="btn btn-ghost" id="logout-btn"><i data-lucide="log-out"></i> Log out</button>
          </div>
        </section>


      </main>
    </div>
  </div>
  <script async src="https://unpkg.com/lucide@latest" onload="window.lucide&&window.lucide.createIcons()"></script>
  <script type="module" src="js/profile.js"></script>
</body>
</html>
