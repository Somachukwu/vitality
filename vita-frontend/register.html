<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Create account</title>
  <link rel="icon" type="image/png" href="vitality-favicon.png" sizes="128x128" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0B0F19" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="apple-touch-icon" href="vitality-logo-icon.png" />
  <link rel="stylesheet" href="styles/main.css" />
  <script>if(localStorage.getItem('theme')==='dark')document.documentElement.classList.add('dark')</script>
</head>
<body>
  <main class="auth-wrap">
    <div class="card auth-card">
      <a class="brand mb-2" href="index.html"><img src="vitality-logo-icon.png" class="brand-logo" alt="Vitality logo"/><span>Vitality</span></a>
      <h2>Create your account</h2>
      <p class="muted text-sm mb-3">Join Vitality to personalize your health and targets.</p>
      <form id="signup-form" class="stack" novalidate>
        <div>
          <label for="name">Full name</label>
          <input id="name" required maxlength="80" placeholder="e.g. Alex Johnson" />
        </div>
        <div>
          <label for="email">Email address</label>
          <input id="email" type="email" required placeholder="you@example.com" />
        </div>
        <div>
          <label for="password">Password</label>
          <input id="password" type="password" required minlength="6" placeholder="Minimum 6 characters" />
        </div>
        <div class="grid grid-2">
          <div>
            <label for="age">Age</label>
            <input id="age" type="number" min="13" max="100" placeholder="e.g. 25" required />
          </div>
          <div>
            <label for="sex">Biological sex</label>
            <select id="sex" required>
              <option value="male" selected>Male</option>
              <option value="female">Female</option>
            </select>
          </div>
        </div>
        <div class="grid grid-2">
          <div>
            <label for="height">Height (cm)</label>
            <input id="height" type="number" min="100" max="240" placeholder="e.g. 175" required />
          </div>
          <div>
            <label for="activity">Daily activity level</label>
            <select id="activity" required>
              <option value="sedentary">Sedentary (Desk job)</option>
              <option value="light">Lightly Active (1-3 d/wk)</option>
              <option value="moderate" selected>Moderately Active (3-5 d/wk)</option>
              <option value="very_active">Very Active (6-7 d/wk)</option>
            </select>
          </div>
        </div>
        <div>
          <label for="goal">Primary fitness &amp; wellness goal</label>
          <select id="goal" required>
            <option value="maintenance" selected>General wellness / Maintain weight</option>
            <option value="weight_loss">Lose weight / Fat loss</option>
            <option value="weight_gain">Build muscle / Gain weight</option>
          </select>
        </div>
        <button class="btn btn-primary btn-block" type="submit" id="submit-btn">Create account</button>
      </form>
      <p class="text-sm mt-3 center muted">Already have an account? <a href="login.html">Log in</a></p>
    </div>
  </main>
  <script type="module">
    import { registerApi } from './js/auth.js';
    import { toast } from './js/utils.js';

    const form = document.getElementById('signup-form');
    const btn = document.getElementById('submit-btn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const val = (id) => (document.getElementById(id)?.value || '').trim();

      const name = val('name');
      const email = val('email');
      const password = document.getElementById('password').value;
      const age = val('age');
      const sex = val('sex');
      const height = val('height');
      const activity = val('activity');
      const goal = val('goal');

      if (!name) {
        toast('Please enter your full name.', 'error');
        document.getElementById('name').focus();
        return;
      }
      if (!email || !email.includes('@')) {
        toast('Please enter a valid email address.', 'error');
        document.getElementById('email').focus();
        return;
      }
      if (!password || password.length < 6) {
        toast('Password must be at least 6 characters.', 'error');
        document.getElementById('password').focus();
        return;
      }
      if (!age || Number(age) < 13 || Number(age) > 100) {
        toast('Please enter a valid age between 13 and 100.', 'error');
        document.getElementById('age').focus();
        return;
      }
      if (!height || Number(height) < 100 || Number(height) > 240) {
        toast('Please enter your height in cm (100–240 cm).', 'error');
        document.getElementById('height').focus();
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Creating account…';

      try {
        await registerApi(name, email, password, age, sex, height, activity, goal);
        toast('Account created successfully! Welcome to Vitality.');
        window.location.href = 'dashboard.html';
      } catch (err) {
        toast(err.message || 'Registration failed. Please try again.', 'error');
        btn.disabled = false;
        btn.textContent = 'Create account';
      }
    });
  </script>
</body>
</html>
